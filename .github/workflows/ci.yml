name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test deps
        run: pip install -e ".[test,text]"
      - name: Run tests
        run: pytest tests/ -v
      - name: Syntax-check training scripts
        run: python -m py_compile training/finetune_nllb.py training/translate.py
